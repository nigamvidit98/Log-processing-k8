# This manifest demonstrates a multi-container Pod.
# A Pod can run multiple containers that share the same network namespace,
# storage, and lifecycle. This is useful for teaching how tightly-coupled
# components can work together inside a single Pod.
apiVersion: v1
kind: Pod
metadata:
  # The Pod name must be unique inside the namespace.
  name: fastapi-multi-container-pod
  # Place this workload in the dedicated learning namespace.
  namespace: log-processing
  # Labels help identify and organize resources.
  labels:
    app: fastapi-backend
    component: backend
    role: multi-container
    environment: development
  # Annotations are optional metadata for tooling and documentation.
  annotations:
    description: "Multi-container Pod example with FastAPI and BusyBox"
    app.kubernetes.io/name: fastapi-backend
    app.kubernetes.io/part-of: log-processing-k8
spec:
  # Always restart the Pod when containers exit unexpectedly.
  restartPolicy: Always
  # Containers in the same Pod share networking and lifecycle.
  containers:
    # The main FastAPI backend container.
    - name: fastapi-backend
      # Use the local backend image built for this project.
      image: log-processing-k8-backend:latest
      # IfNotPresent is a practical default for local development.
      imagePullPolicy: IfNotPresent
      # Expose the application port so it is easy to discover.
      ports:
        - containerPort: 8000
          name: http
          protocol: TCP
      # Unbuffered Python output helps show logs clearly during learning.
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
      # Resource requests and limits make the workload easier to reason about.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    # A second container in the same Pod that stays alive with a simple loop.
    - name: busybox-sleep
      # BusyBox is lightweight and useful for simple educational examples.
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      # The command keeps the container running forever.
      command: ["sh", "-c"]
      args:
        - |
          echo "BusyBox container is running inside the same Pod";
          while true; do sleep 3600; done
      # The BusyBox container also gets modest resource requests.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
