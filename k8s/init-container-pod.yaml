# This manifest demonstrates an Init Container.
# Init containers run before regular containers start and must finish successfully.
# They are useful for setup tasks such as waiting for dependencies or preparing files.
apiVersion: v1
kind: Pod
metadata:
  # Give the Pod a descriptive name so it is easy to identify.
  name: fastapi-init-pod
  # Put the workload in the same learning namespace.
  namespace: log-processing
  labels:
    app: fastapi-backend
    component: backend
    role: init-container
    environment: development
  annotations:
    description: "Pod with an Init Container that runs before the FastAPI container"
    app.kubernetes.io/name: fastapi-backend
    app.kubernetes.io/part-of: log-processing-k8
spec:
  # Restart the Pod if the main container exits unexpectedly.
  restartPolicy: Always
  # Init containers run sequentially before the main containers start.
  initContainers:
    - name: init-message
      # BusyBox is a simple image for a quick initialization task.
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      # Print a message, wait briefly, and exit successfully.
      command: ["sh", "-c"]
      args:
        - |
          echo "Init container starting";
          sleep 5;
          echo "Init container completed successfully";
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  # These are the regular application containers that start after init succeeds.
  containers:
    - name: fastapi-backend
      image: log-processing-k8-backend:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8000
          name: http
          protocol: TCP
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
